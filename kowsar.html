<style>
:root{
  --bg:#F1F2F7; --ink:#10162F; --muted:#586082; --line:#CBD0E3; --accent:#3D5AFE; --on-accent:#FFFFFF;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1124; --ink:#EEF1FF; --muted:#98A2C7; --line:#252E52; --accent:#7C93FF; --on-accent:#0C1124;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1124; --ink:#EEF1FF; --muted:#98A2C7; --line:#252E52; --accent:#7C93FF; --on-accent:#0C1124;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0; min-height:100vh; min-height:100dvh; background:var(--bg); color:var(--ink);
  font-family:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  display:flex; justify-content:center; align-items:center; padding:clamp(24px,6vw,96px) clamp(16px,5vw,64px); -webkit-text-size-adjust:100%;
}
main{width:100%; max-width:680px; display:flex; flex-direction:column; gap:clamp(32px,6vw,64px)}
nav{min-width:0}
h1{margin:0; line-height:0}
.logo{display:block; width:100%; height:auto; fill:currentColor; color:var(--ink); animation:reveal 1s cubic-bezier(.77,0,.18,1) both}
@keyframes reveal{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.intro{display:flex; flex-direction:column; gap:22px; align-items:flex-start}
.intro p{margin:0; font-family:'Newsreader',Georgia,serif; font-style:italic; font-size:clamp(24px,4.5vw,32px); line-height:1.25; color:var(--muted); max-width:24ch}
.cta{
  display:inline-flex; align-items:center; gap:12px; padding:15px 24px; border-radius:999px;
  background:var(--accent); color:var(--on-accent); font-weight:600; font-size:16px; text-decoration:none;
  transition:transform .2s ease, box-shadow .2s ease;
}
.cta svg{width:20px; height:20px; fill:currentColor}
.cta:hover{transform:translateY(-2px); box-shadow:0 10px 24px -10px var(--accent)}
.cta:focus-visible,.row:focus-visible{outline:3px solid var(--accent); outline-offset:4px}
ul{list-style:none; margin:0; padding:0; border-top:1px solid var(--line)}
li{border-bottom:1px solid var(--line)}
.row{
  position:relative; isolation:isolate; overflow:hidden; display:flex; align-items:baseline; gap:16px;
  padding:22px 4px; text-decoration:none; color:var(--ink); transition:color .25s ease, padding .25s ease;
}
.row::before{
  content:""; position:absolute; inset:0; z-index:-1; background:var(--accent);
  transform:scaleX(0); transform-origin:left; transition:transform .35s cubic-bezier(.77,0,.18,1);
}
.row:focus-visible,.row:active{color:var(--on-accent); padding-inline:18px}
.row:focus-visible::before,.row:active::before{transform:scaleX(1)}
.row:focus-visible .handle,.row:active .handle{color:inherit}
@media (hover:hover){
  .row:hover{color:var(--on-accent); padding-inline:18px}
  .row:hover::before{transform:scaleX(1)}
  .row:hover .handle{color:inherit}
}
.name{font-weight:800; font-size:clamp(28px,6vw,42px); letter-spacing:-.02em; line-height:1.1}
.handle{margin-left:auto; font-size:15px; color:var(--muted); text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; transition:color .25s ease}
footer{color:var(--muted); font-size:14px}
@media (max-width:480px){.row{flex-direction:column; gap:4px; align-items:flex-start} .handle{margin-left:0; text-align:left}}
@media (max-width:360px){.cta{width:100%; justify-content:center; padding-inline:16px} .name{font-size:26px}}
@media (min-width:720px) and (max-width:959px){main{max-width:720px} .name{font-size:44px}}
@media (min-width:960px){
  main{max-width:1120px; display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); column-gap:clamp(48px,6vw,96px); row-gap:48px; align-items:center}
  .intro{grid-column:1; gap:28px}
  nav{grid-column:2}
  footer{grid-column:1 / -1; padding-top:24px; border-top:1px solid var(--line)}
  .intro p{font-size:clamp(28px,2.4vw,40px)}
  .name{font-size:clamp(34px,3vw,48px)}
}
@media (min-width:1600px){
  main{max-width:1440px}
  .cta{font-size:19px; padding:18px 30px}
  .handle{font-size:17px}
  footer{font-size:16px}
}
@media (min-width:2200px){main{max-width:1840px} html{font-size:125%}}
@media (max-height:520px) and (orientation:landscape){body{align-items:flex-start} main{gap:24px}}
@media (prefers-reduced-motion:reduce){.logo{animation:none} .row,.row::before,.cta,.handle{transition:none}}
</style>
</head>
