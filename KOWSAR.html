<title>KOWSAR</title>

<style>
:root{
  --bg:#EDF0F7; --surface:#FFFFFF; --ink:#141B34; --muted:#5B6585; --line:#D6DBEA; --accent:#3D5AFE; --accent-ink:#FFFFFF;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1326; --surface:#171E39; --ink:#EEF1FF; --muted:#9AA4C8; --line:#2A3358; --accent:#7C93FF; --accent-ink:#0E1326;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1326; --surface:#171E39; --ink:#EEF1FF; --muted:#9AA4C8; --line:#2A3358; --accent:#7C93FF; --accent-ink:#0E1326;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
  font-family:'Sora',system-ui,-apple-system,'Segoe UI',sans-serif;
  display:flex; justify-content:center; padding:clamp(20px,5vw,56px) 20px;
}
main{width:100%; max-width:560px; display:flex; flex-direction:column; gap:40px; justify-content:center}
header{display:flex; flex-direction:column; gap:14px}
h1{margin:0; line-height:0}
.logo{display:block; width:100%; height:auto; fill:currentColor; color:var(--ink); animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{transform:translateY(30%);opacity:0}to{transform:none;opacity:1}}
header p{margin:0; color:var(--muted); font-weight:300; font-size:17px; max-width:36ch}
ul{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px}
a.link{
  display:flex; align-items:center; gap:16px; padding:14px 18px; text-decoration:none; color:var(--ink);
  background:var(--surface); border:1px solid var(--line); border-radius:16px;
  transition:transform .2s ease, border-color .2s ease, background .2s ease;
}
a.link:hover{transform:translateX(6px); border-color:var(--accent)}
a.link:focus-visible{outline:3px solid var(--accent); outline-offset:3px}
.badge{
  flex:none; width:42px; height:42px; border-radius:12px; display:grid; place-items:center;
  background:var(--ink); color:var(--bg); font-weight:800; font-size:15px;
}
a.link:hover .badge{background:var(--accent); color:var(--accent-ink)}
.name{font-weight:600; font-size:16px}
.handle{margin-left:auto; color:var(--muted); font-size:14px; font-weight:300; text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:45%}
footer{color:var(--muted); font-size:13px; font-weight:300}
@media (prefers-reduced-motion:reduce){.logo{animation:none} a.link{transition:none}}
</style>
</head>
