<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kowsar Ahmmed Dipu</title>
<meta name="description" content="Kowsar Ahmmed Dipu. Find me on LinkedIn, Facebook, Instagram and X.">
<meta property="og:title" content="Kowsar Ahmmed Dipu">
<meta property="og:description" content="Find me on LinkedIn, Facebook, Instagram and X.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,900;1,9..144,400&display=swap" rel="stylesheet">
<style>
:root{
  --base:#8FB8CF; --p1:#2F5D9E; --p2:#EDBB45; --p3:#B0243B; --p4:#3E8A78; --p5:#F6F0DE; --p6:#8A6A47;
  --panel:#F6F0DE; --ink:#1B2340; --muted:#4A5478; --accent:#EDBB45; --on-accent:#1B2340; --weave:.10;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --base:#0E1A38; --p1:#2B4FA8; --p2:#D9A93B; --p3:#8E1F36; --p4:#1F6B63; --p5:#B8C6EC; --p6:#4A3526;
    --panel:#101C3E; --ink:#F6F0DC; --muted:#B4BEDF; --accent:#D9A93B; --on-accent:#1B1630; --weave:.18; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --base:#0E1A38; --p1:#2B4FA8; --p2:#D9A93B; --p3:#8E1F36; --p4:#1F6B63; --p5:#B8C6EC; --p6:#4A3526;
  --panel:#101C3E; --ink:#F6F0DC; --muted:#B4BEDF; --accent:#D9A93B; --on-accent:#1B1630; --weave:.18; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0; min-height:100vh; min-height:100dvh; background:var(--base); color:var(--ink);
  font-family:'Fraunces',Georgia,'Times New Roman',serif; -webkit-text-size-adjust:100%;
  display:flex; justify-content:center; align-items:center; padding:clamp(24px,6vw,80px) clamp(16px,5vw,64px);
}
.filters{position:absolute; width:0; height:0}
/* the painting */
.canvas{position:fixed; inset:0; width:100%; height:100%; z-index:-3}
.canvas path{fill:none; stroke-linecap:round; stroke-linejoin:round}
.weave,.vignette{position:fixed; inset:0; pointer-events:none}
.weave{z-index:-2; mix-blend-mode:multiply; opacity:var(--weave);
  background:repeating-linear-gradient(0deg,#000 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,#000 0 1px,transparent 1px 3px)}
.vignette{z-index:-1; background:radial-gradient(ellipse at center,transparent 55%,rgba(10,12,30,.35) 100%)}

main{width:100%; max-width:720px; display:flex; flex-direction:column; gap:clamp(28px,5vw,48px); position:relative}
.intro{position:relative; isolation:isolate; display:flex; flex-direction:column; gap:22px; align-items:flex-start; padding:clamp(28px,5vw,48px) clamp(24px,5vw,48px)}
.intro::before{content:""; position:absolute; inset:0; z-index:-1; background:var(--panel); opacity:.93;
  border-radius:46% 54% 51% 49% / 12% 10% 14% 11%; filter:url(#daub); transform:rotate(-.6deg)}
h1{margin:0; line-height:0; width:100%}
.logo{display:block; width:100%; height:auto; fill:var(--ink); filter:url(#thick); animation:stroke 1.4s cubic-bezier(.6,0,.2,1) both}
@keyframes stroke{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.intro p{margin:0; font-style:italic; font-weight:400; font-size:clamp(22px,4vw,30px); line-height:1.3; color:var(--muted); max-width:24ch}
.cta{
  position:relative; isolation:isolate; display:inline-flex; align-items:center; gap:12px; padding:16px 30px;
  color:var(--on-accent); font-weight:900; font-size:17px; text-decoration:none; transition:transform .25s ease;
}
.cta::before{content:""; position:absolute; inset:0; z-index:-1; background:var(--accent); border-radius:58% 42% 55% 45% / 62% 55% 45% 38%; filter:url(#daub); transition:transform .3s ease}
.cta svg{width:20px; height:20px; fill:currentColor}
.cta:hover{transform:rotate(-2deg) translateY(-2px)}
.cta:hover::before{transform:scale(1.06,1.12)}
.cta:focus-visible,.row:focus-visible{outline:3px solid var(--p5); outline-offset:6px}
ul{list-style:none; margin:0; padding:0 clamp(8px,3vw,24px); display:flex; flex-direction:column; gap:clamp(14px,2.5vw,22px)}
.row{
  position:relative; isolation:isolate; display:flex; align-items:baseline; gap:16px; padding:22px 30px;
  text-decoration:none; color:#FFF6DC; text-shadow:0 1px 2px rgba(0,0,0,.45); transition:transform .3s ease;
}
.row::before{
  content:""; position:absolute; inset:0; z-index:-1; background:var(--daub); filter:url(#daub);
  border-radius:var(--r); transition:transform .35s cubic-bezier(.6,0,.2,1);
}
li:nth-child(1) .row{--daub:#2A4FA3; --r:42% 58% 47% 53% / 58% 46% 54% 42%}
li:nth-child(2) .row{--daub:#A8223A; --r:56% 44% 52% 48% / 46% 56% 44% 54%; margin-left:clamp(0px,3vw,28px)}
li:nth-child(3) .row{--daub:#6B4A30; --r:48% 52% 41% 59% / 54% 44% 56% 46%}
.row:hover::before,.row:focus-visible::before,.row:active::before{transform:scale(1.04,1.12) rotate(-1deg)}
.row:hover,.row:focus-visible,.row:active{transform:translateX(8px)}
.name{font-weight:900; font-size:clamp(28px,6vw,40px); letter-spacing:-.01em; line-height:1.1}
.handle{margin-left:auto; font-style:italic; font-size:16px; text-align:right; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
footer{font-style:italic; font-size:15px; text-align:right; padding-right:clamp(8px,3vw,24px); color:var(--p5); text-shadow:0 1px 3px rgba(0,0,0,.5)}
@media (max-width:480px){.row{flex-direction:column; gap:4px; align-items:flex-start} .handle{margin-left:0; text-align:left} li:nth-child(2) .row{margin-left:0}}
@media (min-width:960px){
  main{max-width:1120px; display:grid; grid-template-columns:minmax(0,1.2fr) minmax(0,1fr); column-gap:clamp(40px,5vw,88px); align-items:center}
  .intro{grid-column:1}
  nav{grid-column:2}
  footer{grid-column:1 / -1}
}
@media (max-height:520px) and (orientation:landscape){body{align-items:flex-start}}
@media (prefers-reduced-motion:reduce){.logo{animation:none} .row,.row::before,.cta,.cta::before{transition:none}}
</style>
</head>
<body>
<svg class="filters" aria-hidden="true" focusable="false">
  <defs>
    <!-- wobbly, bristled edges for strokes and daubs -->
    <filter id="daub" x="-10%" y="-20%" width="120%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.03" numOctaves="3" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="16" result="d"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.7 0.08" numOctaves="3" seed="9" result="b"/>
      <feDiffuseLighting in="b" surfaceScale="2" lighting-color="#fff" result="l"><feDistantLight azimuth="225" elevation="58"/></feDiffuseLighting>
      <feComposite in="d" in2="l" operator="arithmetic" k1="1.15" k2="0" k3="0" k4="0" result="m"/>
      <feComposite in="m" in2="d" operator="in"/>
    </filter>
    <!-- heavy impasto strokes for the whole painting -->
    <filter id="paint" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.02" numOctaves="3" seed="2" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="70" result="d"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.9 0.05" numOctaves="2" seed="7" result="b"/>
      <feDiffuseLighting in="b" surfaceScale="3.2" lighting-color="#fff" result="l"><feDistantLight azimuth="235" elevation="52"/></feDiffuseLighting>
      <feComposite in="d" in2="l" operator="arithmetic" k1="1.25" k2="0" k3="0" k4="0" result="m"/>
      <feComposite in="m" in2="d" operator="in"/>
    </filter>
    <!-- thick paint on the lettering -->
    <filter id="thick" x="-5%" y="-10%" width="110%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5" result="d"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.55 0.12" numOctaves="3" seed="5" result="b"/>
      <feDiffuseLighting in="b" surfaceScale="2.5" lighting-color="#fff" result="l"><feDistantLight azimuth="230" elevation="60"/></feDiffuseLighting>
      <feComposite in="d" in2="l" operator="arithmetic" k1="1.2" k2="0" k3="0" k4="0" result="m"/>
      <feComposite in="m" in2="d" operator="in"/>
    </filter>
  </defs>
</svg>
